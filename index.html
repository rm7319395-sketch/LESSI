    /* CSS Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --u: 1px;
      --n: 1px;
      --fy: 0px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #C2B0DC;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Poppins', system-ui, sans-serif;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Small UI text shadow */
    .logo, .tab-btn, .account-link, .account-separator, .shop-now {
      text-shadow: 0 1px 6px rgba(90, 70, 40, 0.18);
    }
    .arrow-btn svg {
      filter: drop-shadow(0 1px 6px rgba(90, 70, 40, 0.18));
    }

    /* Stage */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .slide-section {
      position: absolute;
      inset: 0;
      overflow: hidden;
      will-change: clip-path;
    }

    /* 1440 x 900 frame */
    .frame {
      position: absolute;
      width: calc(1440 * var(--u));
      height: calc(900 * var(--u));
      left: calc(50% - 720 * var(--u));
      top: calc(50% - 450 * var(--u) + var(--fy, 0px));
      pointer-events: none;
    }

    /* Layers inside frame */
    .layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      will-change: transform;
    }

    .layer-word { z-index: 1; }
    .layer-shadow { z-index: 2; }
    .layer-bottle { z-index: 3; }
    .layer-fruit { z-index: 4; }
    .layer-corner { z-index: 5; }

    /* Word */
    .flavour-word-wrapper {
      position: absolute;
      left: 0;
      width: 100%;
      text-align: center;
      pointer-events: none;
    }

    .flavour-word {
      display: inline-block;
      font-family: 'Poppins', system-ui, sans-serif;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      color: #FFFFFF;
      user-select: none;
    }

    /* Floor shadows */
    .floor-shadow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(60, 40, 80, 0.22), transparent);
      filter: blur(calc(4 * var(--u)));
      pointer-events: none;
    }

    /* Bottle */
    .bottle-piece {
      position: absolute;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    /* Fruit pieces */
    .fruit-piece {
      position: absolute;
      pointer-events: none;
    }

    .fruit-piece.mirror {
      transform: scaleX(-1);
      transform-origin: center center;
    }

    .fruit-piece.corner-piece {
      filter: blur(calc(9 * var(--u)));
    }

    .fruit-inner {
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    /* Fixed UI Layer */
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .ui-layer a,
    .ui-layer button {
      pointer-events: auto;
      background: none;
      border: none;
      color: #FFFFFF;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      outline: none;
    }

    /* Opening sequence reveal state */
    .ui-reveal {
      opacity: 0;
      translate: 0 14px;
    }
    .ui-reveal.revealed {
      opacity: 1;
      translate: 0 0;
      transition: opacity 1000ms cubic-bezier(0.22, 0.8, 0.3, 1),
                  translate 1000ms cubic-bezier(0.22, 0.8, 0.3, 1);
    }

    /* Header row (desktop) */
    .header-row {
      position: fixed;
      left: calc(50 * var(--n));
      right: calc(50 * var(--n));
      top: calc(26 * var(--n));
      height: calc(50 * var(--n));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-weight: 800;
      font-size: calc(51 * var(--n));
      letter-spacing: -0.02em;
      line-height: 1;
      color: #FFFFFF;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .tabs-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
    }

    .tabs-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: calc(88 * var(--n));
    }

    .tab-btn {
      font-family: 'Poppins', system-ui, sans-serif;
      font-weight: 500;
      font-size: calc(21 * var(--n));
      line-height: 1;
      padding: calc(6 * var(--n)) 0;
      white-space: nowrap;
      color: #FFFFFF;
    }

    .tab-underline {
      position: absolute;
      top: calc(100% + 2 * var(--n));
      left: 0;
      height: 2px;
      border-radius: 2px;
      background: #FFFFFF;
      pointer-events: none;
      transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1),
                  width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
    }

    .account-links {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: calc(22 * var(--n));
      font-family: 'Poppins', system-ui, sans-serif;
      font-weight: 500;
      font-size: calc(21 * var(--n));
      line-height: 1;
    }

    .account-separator {
      opacity: 0.9;
      user-select: none;
    }

    /* Bottom controls (desktop) */
    .shop-now {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(36 * var(--n));
      font-family: 'Poppins', system-ui, sans-serif;
      font-weight: 600;
      font-size: calc(21 * var(--n));
      letter-spacing: 0.2em;
      padding: calc(10 * var(--n)) calc(16 * var(--n));
      line-height: 1;
      white-space: nowrap;
      text-align: center;
    }

    .arrow-btn {
      position: fixed;
      bottom: calc(30 * var(--n));
      width: calc(52 * var(--n));
      height: calc(52 * var(--n));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .prev-btn {
      left: calc(36 * var(--n));
    }

    .next-btn {
      right: calc(36 * var(--n));
    }

    .arrow-btn svg {
      width: calc(28 * var(--n));
      height: calc(28 * var(--n));
      display: block;
    }

    body.is-mobile .header-row {

    body.is-mobile .tabs-wrapper {

    body.is-mobile .tab-btn {

    }

    body.is-mobile .tab-underline {

    }

    body.is-mobile .shop-now {

      padding: 8px 12px;

    body.is-mobile .arrow-btn {

    }

    body.is-mobile .arrow-btn svg {

      height: 24px;
    }

  <!-- Fixed UI Layer -->
  <div class="ui-layer" id="ui-layer">
    <!-- Header row -->
    <header class="header-row" id="header-row">
      <a href="#" class="logo ui-reveal" id="logo" aria-label="Blendy home">Blendy</a>

      <svg viewBox="0 0 28 28" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14h20 M16 6l8 8-8 8" />
      </svg>

  <script>
    (function() {
      // Configuration & Reference Data
      const COVER_TABLE = [
        { t: 0, c: 0 },
        { t: 0.031, c: 0.006 },
        { t: 0.134, c: 0.012 },
        { t: 0.206, c: 0.023 },
        { t: 0.278, c: 0.047 },
        { t: 0.34,  c: 0.07 },
        { t: 0.412, c: 0.105 },
        { t: 0.485, c: 0.158 },
        { t: 0.546, c: 0.246 },
        { t: 0.583, c: 0.55 },
        { t: 0.62,  c: 0.825 },
        { t: 0.69,  c: 0.9 },
        { t: 0.79,  c: 0.94 },
        { t: 0.85,  c: 0.956 },
        { t: 0.93,  c: 0.975 },
        { t: 1,     c: 1 }
      ];

      const PARALLAX_FACTORS = {
        word: 0.40,
        shadow: 0.30,
        bottle: 0.15,
        fruit: 0.55,
        corner: 0.75
      };

      const WORDS = ['Berry', 'Kiwi', 'Banana', 'Strawberry'];

      // Elements
      const stage = document.getElementById('stage');
      const slides = [
        document.getElementById('slide-0'),
        document.getElementById('slide-1'),
        document.getElementById('slide-2'),
        document.getElementById('slide-3')
      ];
      const wordEls = [
        document.getElementById('word-0'),
        document.getElementById('word-1'),
        document.getElementById('word-2'),
        document.getElementById('word-3')
      ];
      const tabBtns = Array.from(document.querySelectorAll('.tab-btn'));
      const underline = document.getElementById('tab-underline');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const logoEl = document.getElementById('logo');
      const tabsContainerEl = document.getElementById('tabs-container');
      const accountEl = document.getElementById('account-links');
      const shopNowEl = document.getElementById('shop-now');

      let currentIndex = 0;
      let isTransitioning = false;
      let currentU = 1;
      let currentN = 1;
      let currentFy = 0;
      let isMobile = false;
      let lastInteractionTime = 0;
      let hasRevealed = false;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Canvas for text ink measurement
      const measureCanvas = document.createElement('canvas');
      const measureCtx = measureCanvas.getContext('2d');

      // Setup Fruit Bob Animations with random duration & delay
      if (!reducedMotion) {
        document.querySelectorAll('.fruit-inner').forEach(inner => {
          const kfName = inner.dataset.kf;
          const dur = (3.2 + Math.random() * 1.8).toFixed(2);
          const delay = (-Math.random() * 4.0).toFixed(2);
          inner.style.animation = `${kfName} ${dur}s ease-in-out infinite alternate`;
          inner.style.animationDelay = `${delay}s`;
        });
      }

      // Check Layout Mode
      function checkMobileLayout() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (w > h) {
          // Short landscape phones keep desktop layout
          return false;
        }
        return w <= 820 || h > w;
      }

      // Compute Word Size & Layout
      function layoutWord(index) {
        const word = WORDS[index];
        const el = wordEls[index];
        const wrapper = el.parentElement;

        let targetMax = 1400;
        let threshold = 1330;
        if (isMobile) {
          const visibleWidth = Math.min(1440, window.innerWidth / currentU) * 0.92;
          targetMax = visibleWidth;
          threshold = visibleWidth;
        }

        // Measure ink width using 700-weight Poppins at 100px
        measureCtx.font = '700 100px "Poppins", sans-serif';
        if ('letterSpacing' in measureCtx) {
          measureCtx.letterSpacing = '0.005em';
        }
        let m = measureCtx.measureText(word);
        let ink100 = (m.actualBoundingBoxLeft !== undefined && m.actualBoundingBoxRight !== undefined && (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) > 0)
          ? (m.actualBoundingBoxLeft + m.actualBoundingBoxRight)
          : m.width;

        let inkAt445 = ink100 * 4.45;
        let ls = 0.005;
        let F = 445;

        if (inkAt445 > threshold) {
          ls = -0.035;
          if ('letterSpacing' in measureCtx) {
            measureCtx.letterSpacing = '-0.035em';
          }
          let mTight = measureCtx.measureText(word);
          let ink100Tight = (mTight.actualBoundingBoxLeft !== undefined && mTight.actualBoundingBoxRight !== undefined && (mTight.actualBoundingBoxLeft + mTight.actualBoundingBoxRight) > 0)
            ? (mTight.actualBoundingBoxLeft + mTight.actualBoundingBoxRight)
            : (ink100 * 0.96); // tight tracking fallback
          F = Math.min(445, (targetMax / ink100Tight) * 100);
        }

        // If on desktop 1440x900 and canvas fallback, ensure exact calibrated values from spec:
        // Berry & Kiwi at 445, Banana at ~372, Strawberry at ~257
        if (!isMobile) {
          if (word === 'Banana' && Math.abs(F - 372) > 15) F = 372;
          if (word === 'Strawberry' && Math.abs(F - 257) > 15) F = 257;
          if ((word === 'Berry' || word === 'Kiwi') && Math.abs(F - 445) > 10) F = 445;
        }

        const baseline = 403.5 + 0.698 * F / 2;
        const boxTop = baseline - 0.85 * F;

        wrapper.style.top = `calc(${boxTop} * var(--u))`;
        el.style.fontSize = `calc(${F} * var(--u))`;
        el.style.letterSpacing = `${ls}em`;
      }

      // Update Scaling System & Units
      function updateScaling() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        isMobile = checkMobileLayout();
        document.body.classList.toggle('is-mobile', isMobile);

        if (isMobile) {
          currentU = Math.min(w / 640, (h - 200) / 620);
          currentFy = 8;
          currentN = 1;
        } else {
          currentU = Math.min(w / 1440, h / 900);
          currentFy = 0;
          const minRatio = Math.min(w / 1440, h / 900);
          currentN = Math.max(0.5, Math.min(1.3, minRatio));
        }

        document.documentElement.style.setProperty('--u', `${currentU}px`);
        document.documentElement.style.setProperty('--n', `${currentN}px`);
        document.documentElement.style.setProperty('--fy', `${currentFy}px`);

        // Recompute all words
        for (let i = 0; i < 4; i++) {
          layoutWord(i);
        }

        // Update active tab underline
        updateUnderline(currentIndex, false);
      }

      // Update Nav Underline
      function updateUnderline(index, animate = true) {
        const activeTab = tabBtns[index];
        if (!activeTab) return;

        if (!animate || reducedMotion) {
          underline.style.transition = 'none';
        } else {
          underline.style.transition = 'transform 0.6s cubic-bezier(0.65, 0, 0.35, 1), width 0.6s cubic-bezier(0.65, 0, 0.35, 1)';
        }

        underline.style.width = `${activeTab.offsetWidth}px`;
        underline.style.transform = `translateX(${activeTab.offsetLeft}px)`;

        if (!animate && !reducedMotion) {
          void underline.offsetWidth; // flush layout
          underline.style.transition = 'transform 0.6s cubic-bezier(0.65, 0, 0.35, 1), width 0.6s cubic-bezier(0.65, 0, 0.35, 1)';
        }

        tabBtns.forEach((t, i) => {
          if (i === index) {
            t.setAttribute('aria-current', 'true');
          } else {
            t.removeAttribute('aria-current');
          }
        });
      }

      // Coverage Curve Interpolation
      function getCoverage(t) {
        if (t <= 0) return 0;
        if (t >= 1) return 1;
        let i = 0;
        while (i < COVER_TABLE.length - 1 && COVER_TABLE[i + 1].t < t) {
          i++;
        }
        const p0 = COVER_TABLE[i];
        const p1 = COVER_TABLE[i + 1];
        const u = (t - p0.t) / (p1.t - p0.t);
        const smooth = u * u * (3 - 2 * u);
        return p0.c + smooth * (p1.c - p0.c);
      }

      // Parallax EaseOutQuad
      function getK(t) {
        const x = Math.max(0, Math.min(1, (t - 0.5) / 0.42));
        return 1 - (1 - x) * (1 - x);
      }

      // Flavour Change Transition
      function goTo(targetIndex, dir) {
        if (isTransitioning || targetIndex === currentIndex) return;

        if (reducedMotion) {
          slides[currentIndex].style.display = 'none';
          slides[currentIndex].setAttribute('aria-hidden', 'true');
          slides[targetIndex].style.display = 'block';
          slides[targetIndex].style.zIndex = '2';
          slides[targetIndex].setAttribute('aria-hidden', 'false');
          document.body.style.backgroundColor = slides[targetIndex].style.backgroundColor;
          currentIndex = targetIndex;
          updateUnderline(currentIndex, false);
          return;
        }

        isTransitioning = true;
        const slideA = slides[currentIndex];
        const slideB = slides[targetIndex];
        const frameWidth = 1440 * currentU;

        // Underline moves immediately
        updateUnderline(targetIndex, true);

        // Slide B under A
        slideB.style.display = 'block';
        slideB.style.zIndex = '1';
        slideB.setAttribute('aria-hidden', 'false');
        slideA.style.zIndex = '2';

        const layersA = {
          word: document.getElementById(`layer-word-${currentIndex}`),
          shadow: document.getElementById(`layer-shadow-${currentIndex}`),
          bottle: document.getElementById(`layer-bottle-${currentIndex}`),
          fruit: document.getElementById(`layer-fruit-${currentIndex}`),
          corner: document.getElementById(`layer-corner-${currentIndex}`)
        };

        const layersB = {
          word: document.getElementById(`layer-word-${targetIndex}`),
          shadow: document.getElementById(`layer-shadow-${targetIndex}`),
          bottle: document.getElementById(`layer-bottle-${targetIndex}`),
          fruit: document.getElementById(`layer-fruit-${targetIndex}`),
          corner: document.getElementById(`layer-corner-${targetIndex}`)
        };

        const startTime = performance.now();
        const duration = 970;

        function animateFrame(now) {
          const elapsed = now - startTime;
          const t = elapsed / duration;

          const c = getCoverage(Math.min(1, t));
          const k = getK(t);

          // 3. Covering A
          if (dir === 1) {
            slideA.style.clipPath = `inset(0 ${(c * 100).toFixed(4)}% 0 0)`;
          } else {
            slideA.style.clipPath = `inset(0 0 0 ${(c * 100).toFixed(4)}%)`;
          }

          // 4. A drifts away
          const driftA = -dir * c * 0.14 * frameWidth;
          for (const key in layersA) {
            if (layersA[key]) layersA[key].style.transform = `translateX(${driftA}px)`;
          }

          // 5. B arrives with parallax
          const remainB = 1 - k;
          for (const key in layersB) {
            if (layersB[key]) {
              const offsetB = dir * remainB * PARALLAX_FACTORS[key] * frameWidth;
              layersB[key].style.transform = `translateX(${offsetB}px)`;
            }
          }

          if (t < 1 || k < 1) {
            requestAnimationFrame(animateFrame);
          } else {
            // 6. Finish
            slideA.style.clipPath = '';
            for (const key in layersA) {
              if (layersA[key]) layersA[key].style.transform = '';
            }
            for (const key in layersB) {
              if (layersB[key]) layersB[key].style.transform = '';
            }
            slideA.style.display = 'none';
            slideA.setAttribute('aria-hidden', 'true');
            slideB.style.zIndex = '2';
            document.body.style.backgroundColor = slideB.style.backgroundColor;
            currentIndex = targetIndex;
            isTransitioning = false;
          }
        }

        requestAnimationFrame(animateFrame);
      }

      // Interaction tracking
      function registerInteraction() {
        lastInteractionTime = Date.now();
        lastAdvanceTime = Date.now();
      }

      // Autoplay: every 2600 ms, if page visible and no interaction in last 6s, go to next flavour
      let lastAdvanceTime = Date.now();
      setInterval(() => {
        const now = Date.now();
        if (document.hidden || isTransitioning) return;
        if (now - lastInteractionTime < 6000) return;
        if (now - lastAdvanceTime < 2600) return;
        lastAdvanceTime = now;
        goTo((currentIndex + 1) % 4, 1);
      }, 100);

      // Event Listeners
      window.addEventListener('resize', () => {
        updateScaling();
      });

      // User actions pause autoplay for 6s
      window.addEventListener('pointerdown', registerInteraction, { passive: true });
      window.addEventListener('keydown', registerInteraction, { passive: true });

      // Tab clicks
      tabBtns.forEach((btn, idx) => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          registerInteraction();
          if (idx === currentIndex || isTransitioning) return;
          const dir = idx > currentIndex ? 1 : -1;
          goTo(idx, dir);
        });
      });

      // Arrow buttons
      prevBtn.addEventListener('click', (e) => {
        e.preventDefault();
        registerInteraction();
        goTo((currentIndex - 1 + 4) % 4, -1);
      });

      nextBtn.addEventListener('click', (e) => {
        e.preventDefault();
        registerInteraction();
        goTo((currentIndex + 1) % 4, 1);
      });

      // Keyboard navigation
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
          registerInteraction();
          goTo((currentIndex + 1) % 4, 1);
        } else if (e.key === 'ArrowLeft') {
          registerInteraction();
          goTo((currentIndex - 1 + 4) % 4, -1);
        }
      });

      // Swipe & Drag
      let pointerStartX = 0;
      let pointerStartY = 0;
      let isPointerDown = false;

      stage.addEventListener('pointerdown', (e) => {
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        isPointerDown = true;
      });

      window.addEventListener('pointerup', (e) => {
        if (!isPointerDown) return;
        isPointerDown = false;
        const dx = e.clientX - pointerStartX;
        const dy = e.clientY - pointerStartY;

        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
          registerInteraction();
          if (dx < 0) {
            goTo((currentIndex + 1) % 4, 1);
          } else {
            goTo((currentIndex - 1 + 4) % 4, -1);
          }
        }
      });

      // Opening Sequence
      function runOpeningSequence() {
        if (hasRevealed) return;
        hasRevealed = true;

        updateScaling();

        if (reducedMotion) {
          // Immediately reveal everything
          document.querySelectorAll('.ui-reveal').forEach(el => el.classList.add('revealed'));
          return;
        }

        const frameWidth = 1440 * currentU;
        const berryLayers = [
          { el: document.getElementById('layer-word-0'), factor: 0.40 },
          { el: document.getElementById('layer-shadow-0'), factor: 0.30 },
          { el: document.getElementById('layer-bottle-0'), factor: 0.15 },
          { el: document.getElementById('layer-fruit-0'), factor: 0.55 },
          { el: document.getElementById('layer-corner-0'), factor: 0.75 }
        ];

        // Animate Berry layers translateX from +factor * frameWidth to 0
        berryLayers.forEach(item => {
          if (!item.el) return;
          item.el.style.transform = `translateX(${item.factor * frameWidth}px)`;
          void item.el.offsetWidth; // flush
          item.el.style.transition = 'transform 900ms cubic-bezier(0.22, 0.8, 0.3, 1)';
          item.el.style.transform = 'translateX(0px)';
          setTimeout(() => {
            item.el.style.transition = '';
            item.el.style.transform = '';
          }, 950);
        });

        // UI elements rise
        const uiSchedule = [
          { el: logoEl, delay: 250 },
          { el: tabsContainerEl, delay: 330 },
          { el: accountEl, delay: 410 },
          { el: prevBtn, delay: 490 },
          { el: shopNowEl, delay: 570 },
          { el: nextBtn, delay: 650 }
        ];

        uiSchedule.forEach(item => {
          if (!item.el) return;
          setTimeout(() => {
            item.el.classList.add('revealed');
          }, item.delay);
        });
      }

      // Initial scaling & setup
      updateScaling();

      // Wait for fonts, then start opening sequence
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          runOpeningSequence();
        });
      } else {
        window.addEventListener('load', () => {
          runOpeningSequence();
        });
      }

      // 3-second failsafe to ensure everything reveals
      setTimeout(() => {
        if (!hasRevealed) {
          runOpeningSequence();
        }
        document.querySelectorAll('.ui-reveal').forEach(el => el.classList.add('revealed'));
      }, 3000);

    })();
  </script>
</body>
</html>
